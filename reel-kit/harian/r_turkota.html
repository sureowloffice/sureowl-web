<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head><body><script src="data.js"></script><canvas id="c" width="1080" height="1920"></canvas><script>
const W=1080,H=1920,c=document.getElementById('c'),x=c.getContext('2d');const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),eo=t=>1-Math.pow(1-cl(t),3),back=t=>{t=cl(t);const s=1.9;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
const Y='#FFD23F';
function out(s,X,Y0,size,col,al=1,align='center',w=900,lw){x.save();x.globalAlpha=al;x.font=`900 ${size}px Inter`;x.textAlign=align;x.textBaseline='middle';x.lineJoin='round';x.lineWidth=lw||size*.2;x.strokeStyle='#111';x.strokeText(s,X,Y0);x.fillStyle=col;x.fillText(s,X,Y0);x.restore()}
function rr(X,Y0,w,h,r,fill){x.beginPath();x.roundRect(X,Y0,w,h,r);x.fillStyle=fill;x.fill()}
function pop(t0,t,fn){const a=t-t0;if(a<0)return;const s=back(a/.32);x.save();fn(s,cl(a/.12))}

const AV=['#FF6B6B','#4D96FF','#6BCB77','#C77DFF','#FF9F1C'];
function komen(t,t0,t1,u,txt,y,ci){if(t<t0||t>t1)return;const a=t-t0,s=back(a/.3),o=cl((t1-t)/.2);x.save();x.globalAlpha=o;x.translate(W/2,y);x.scale(s,s);
  x.font='600 38px Inter';const L=wrapT(txt,700,'600 38px Inter');const h=150+L.length*48;const w=880;
  x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=24;x.shadowOffsetY=8;rr(-w/2,-h/2,w,h,30,'#fff');x.shadowColor='transparent';
  x.beginPath();x.arc(-w/2+62,-h/2+62,34,0,7);x.fillStyle=AV[ci%5];x.fill();x.font='900 36px Inter';x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.fillText(u[0].toUpperCase(),-w/2+62,-h/2+63);
  x.textAlign='left';x.font='800 32px Inter';x.fillStyle='#1B1B1F';x.fillText('@'+u,-w/2+112,-h/2+50);x.font='600 24px Inter';x.fillStyle='#8A8A95';x.fillText('komentar di @viralindongid',-w/2+112,-h/2+84);
  x.font='600 38px Inter';x.fillStyle='#1B1B1F';L.forEach((l,i)=>x.fillText(l,-w/2+40,-h/2+130+i*48));x.restore()}
function wrapT(s,max,f){x.font=f;const w=s.split(' ');const L=[];let l='';for(const q of w){const t=l?l+' '+q:q;if(x.measureText(t).width>max&&l){L.push(l);l=q}else l=t}L.push(l);return L}
// ---- kartu distrik / tahap ----
function stat(t,t0,t1,ic,nm,pct,col,tag,y=430){if(t<t0||t>t1)return;const a=t-t0,s=back(a/.3),o=cl((t1-t)/.15);x.save();x.globalAlpha=o;x.translate(W/2,y);x.scale(s,s);
  const w=900,h=230;x.shadowColor='rgba(0,0,0,.4)';x.shadowBlur=24;rr(-w/2,-h/2,w,h,32,'rgba(18,14,40,.92)');x.shadowColor='transparent';x.lineWidth=5;x.strokeStyle=col;x.beginPath();x.roundRect(-w/2,-h/2,w,h,32);x.stroke();
  x.textBaseline='middle';x.textAlign='left';x.font='900 60px Inter';x.fillStyle='#fff';x.fillText(ic+' '+nm,-w/2+44,-h/2+68);
  const v=Math.round(pct*eo((a-.15)/.8));x.textAlign='right';x.font='900 84px Inter';x.fillStyle=col;x.fillText(v+'%',w/2-44,-h/2+70);
  rr(-w/2+44,22,w-88,30,15,'rgba(255,255,255,.15)');rr(-w/2+44,22,Math.max(30,(w-88)*v/100*2.6>w-88?w-88:(w-88)*v/100*2.6),30,15,col);
  x.textAlign='left';x.font='800 34px Inter';x.fillStyle=Y;x.fillText(tag,-w/2+44,-h/2+h-30);x.restore()}
function tahap(t,t0,t1,y=430){if(t<t0||t>t1)return;const a=t-t0,s=back(a/.3);x.save();x.translate(W/2,y);x.scale(s,s);const w=900,h=190;rr(-w/2,-h/2,w,h,30,'rgba(255,255,255,.96)');
  x.textBaseline='middle';x.textAlign='left';x.font='800 30px Inter';x.fillStyle='#E53935';x.fillText('● LIVE  ·  TAHAP 0/3',-w/2+40,-h/2+44);x.font='900 50px Inter';x.fillStyle='#1B1B1F';x.fillText('🚧 PERSIAPAN LAHAN',-w/2+40,-h/2+100);
  const v=Math.round(12*eo((a-.2)/1));x.textAlign='right';x.font='900 44px Inter';x.fillStyle='#F5A300';x.fillText(v+'%',w/2-40,-h/2+100);rr(-w/2+40,h/2-46,w-80,22,11,'#EEE');rr(-w/2+40,h/2-46,(w-80)*v/100,22,11,'#F5A300');x.restore()}
// ---- subtitle ----
function sub(t){for(const [a,b,s,hl] of window.SUB){if(t>=a&&t<b){const k=cl((t-a)/.08);const sc=.85+.15*back((t-a)/.18);x.save();x.translate(W/2,1340);x.scale(sc,sc);x.font='900 74px Inter';x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';
   const words=s.split(' ');const tw=x.measureText(s).width;if(tw>950){const k=950/tw;x.scale(k,k)}let X0=-tw/2;x.textAlign='left';for(const w of words){const ww=x.measureText(w+' ').width;x.lineWidth=16;x.strokeStyle='#111';x.strokeText(w,X0,0);x.fillStyle=(hl&&hl.includes(w.replace(/[.,?!…]/g,'')))?Y:'#fff';x.fillText(w,X0,0);X0+=ww}x.restore();return}}}

function card(t,t0,t1,y,l1,l2,col,dark=true){if(t<t0||t>t1)return;const a=t-t0,s=back(a/.3),o=cl((t1-t)/.15);x.save();x.globalAlpha=o;x.translate(W/2,y);x.scale(s,s);x.font='900 56px Inter';const w=Math.max(x.measureText(l1).width,l2?(x.font='800 40px Inter',x.measureText(l2).width):0)+110;const h=l2?190:120;
  x.shadowColor='rgba(0,0,0,.4)';x.shadowBlur=24;rr(-w/2,-h/2,w,h,32,dark?'rgba(18,14,40,.93)':'#fff');x.shadowColor='transparent';x.lineWidth=6;x.strokeStyle=col;x.beginPath();x.roundRect(-w/2,-h/2,w,h,32);x.stroke();
  x.textAlign='center';x.textBaseline='middle';x.font='900 56px Inter';x.fillStyle=dark?'#fff':'#111';x.fillText(l1,0,l2?-34:2);if(l2){x.font='800 40px Inter';x.fillStyle=col;x.fillText(l2,0,46)}x.restore()}
function bars(t,t0,t1){if(t<t0||t>t1)return;const a=t-t0,s=back(a/.3);x.save();x.translate(W/2,470);x.scale(s,s);const w=760,h=230;rr(-w/2,-h/2,w,h,30,'rgba(18,14,40,.93)');
  const B=[['🍞 Lapar',.06,'#FF4D4D'],['⚡ Energi',.12,'#FF9F1C']];B.forEach((b,i)=>{const y=-h/2+70+i*90;x.font='800 40px Inter';x.textAlign='left';x.textBaseline='middle';x.fillStyle='#fff';x.fillText(b[0],-w/2+40,y);rr(-w/2+300,y-16,400,32,16,'rgba(255,255,255,.15)');const v=b[1]*(1+.6*Math.sin(t*14));rr(-w/2+300,y-16,Math.max(20,400*v),32,16,b[2])});x.restore()}
function joy(t,t0,t1){if(t<t0||t>t1)return;const a=cl((t-t0)/.2)*cl((t1-t)/.2);x.save();x.globalAlpha=a;const cx=230,cy=1130;x.beginPath();x.arc(cx,cy,120,0,7);x.fillStyle='rgba(255,255,255,.18)';x.fill();x.lineWidth=6;x.strokeStyle='rgba(255,255,255,.7)';x.stroke();
  const k=Math.sin((t-t0)*2.2)*.25;x.beginPath();x.arc(cx+70*Math.cos(k),cy+70*Math.sin(k),55,0,7);x.fillStyle='rgba(255,255,255,.92)';x.fill();x.font='800 30px Inter';x.textAlign='center';x.fillStyle='#fff';x.shadowColor='#000';x.shadowBlur=10;x.fillText('🕹️ JOYSTICK',cx,cy+165);x.restore()}
function coin(t,t0){const a=t-t0;if(a<0||a>1.6)return;for(let i=0;i<9;i++){const p=a/1.2,ang=i*.7,r=80+p*380;const X=W/2+Math.cos(ang)*r*.8,Y=760-p*300+Math.sin(ang)*r*.4+p*p*500;x.save();x.globalAlpha=cl(1.6-a);x.font='70px "Noto Color Emoji"';x.textAlign='center';x.fillText('🪙',X,Y);x.restore()}}
window.draw=async(f,t)=>{const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src='bg/'+String(f+1).padStart(5,'0')+'.jpg'});x.drawImage(im,0,0,W,H);
  if(t>4.75&&t<33){x.save();rr(60,190,240,62,31,Y);x.font='900 32px Inter';x.fillStyle='#111';x.textAlign='center';x.textBaseline='middle';x.fillText('TUR KOTA',180,222);x.restore()}
  if(t>=2.5&&t<4.75){const a=cl((4.75-t)/.2);pop(2.5,t,(s)=>{x.translate(W/2,470);x.scale(s,s);out('AVATAR LO',0,-110,120,'#fff',a);out('HIDUP',0,20,150,Y,a);out('DI KOTA INI 😳',0,150,96,'#fff',a);x.restore()})}
  joy(t,4.8,7.85);
  card(t,7.95,10.0,470,'🎨 GANTI TAMPILAN','rambut · warna kulit · gaya',Y);
  bars(t,10.1,12.5);if(t>=11.45&&t<12.5)out('SERIUS. 😵',W/2,760,110,'#fff',cl((t-11.45)/.1));
  if(t>=12.5&&t<16.25){const w=['LAPER','KOIN','KERJA!'],ts=[12.7,14.3,15.75];w.forEach((q,i)=>{if(t>=ts[i])pop(ts[i],t,(s)=>{x.translate(W/2,380+i*150);x.scale(s,s);out((i?'→ ':'')+q,0,0,i==2?130:100,i==2?Y:'#fff');x.restore()})})}
  card(t,16.3,17.3,470,'🧾 JADI KASIR',null,'#4D96FF');
  card(t,17.35,19.0,470,'💼 KERJA KANTORAN','di Label Musik Office','#C77DFF');
  card(t,19.05,21.5,470,'⏱️ MINI GAME 25 DETIK','gaji langsung cair','#FF9F1C');if(t>=20.2&&t<21.5){pop(20.2,t,(s)=>{x.translate(W/2,720);x.scale(s,s);out('+36 🪙',0,0,140,Y);x.restore()})}coin(t,20.2);
  card(t,21.55,23.15,470,'🍚 BELI NASI','⚡ energi penuh lagi','#3DDC97');
  if(t>=23.6&&t<25.3)pop(23.6,t,(s)=>{x.translate(W/2,520);x.rotate(-.05);x.scale(s,s);out('PALING SERU 🔥',0,0,120,Y);x.restore()});
  card(t,25.4,28.9,470,'🎪 FESTIVAL MALAM MINGGU','tiap Sabtu · 20.00 WIB','#FF4D4D');
  card(t,29.0,33.0,450,'🎸 PILIH BIDANG MUSIK LO','band lo tampil di panggung!',Y);if(t>=31.85&&t<33)pop(31.85,t,(s)=>{x.translate(W/2,700);x.scale(s,s);out('👀 DITONTON SATU KOTA',0,0,70,'#fff');x.restore()});
  if(t>=33.0){const a=t-33.0;if(a<1.75)pop(33.0,t,(s)=>{x.translate(W/2,430);x.scale(s,s);out('FOLLOW =',0,-60,100,'#fff');out('LANGSUNG JADI WARGA',0,55,84,Y);x.restore()});
    else{pop(34.75,t,(s)=>{x.translate(W/2,400);x.scale(s,s);out('KOMEN BIDANG LO 👇',0,0,92,Y);x.restore()});
      const D=[['🎵 MUSIK','#FF4D4D'],['🎨 RUPA','#C77DFF'],['💃 TARI','#4D96FF'],['🎬 FILM','#FF9F1C'],['🪘 TRADISI','#E07A3F'],['📖 SASTRA','#3DDC97']];
      D.forEach((d,i)=>{const ai=t-34.95-i*.07;if(ai<0)return;const s=back(ai/.3);const col=i%3,row=Math.floor(i/3);x.save();x.translate(W/2+(col-1)*310,540+row*105);x.scale(s,s);rr(-145,-42,290,84,42,d[1]);x.font='900 36px Inter';x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.fillText(d[0],0,2);x.restore()})}
    if(t>=36.0)pop(36.0,t,(s)=>{x.translate(W/2,1500);x.scale(s,s);rr(-420,-95,840,190,30,'rgba(15,15,20,.9)');x.font='800 32px Inter';x.fillStyle=Y;x.textAlign='center';x.textBaseline='middle';x.fillText('🎪 FESTIVAL MALAM MINGGU',0,-45);x.font='900 52px Inter';x.fillStyle='#fff';x.fillText('Nanti malam 20.00 WIB',0,15);x.font='700 30px Inter';x.fillStyle='#BDBDC7';x.fillText('gue tunggu di panggung! · link di bio',0,62);x.restore()})}
  if(t<36.0)sub(t);
  for(const fl of [15.75]){const d=t-fl;if(d>=0&&d<.12){x.fillStyle=`rgba(255,255,255,${.6*(1-d/.12)})`;x.fillRect(0,0,W,H)}}
};
